<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ALL CHAT AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header class="header">

        <div class="logo">
            ALL CHAT <span>AI</span>
        </div>

        <p>Compare multiple AI answers in one place</p>

    </header>


    <main class="container">

        <!-- Question Section -->
        <section class="card">

            <div class="section-title">
                <h2>Ask Your Question</h2>
                <span>01</span>
            </div>

            <textarea
                id="question"
                placeholder="Type your question here..."
            ></textarea>


            <h3>Select AI Services</h3>

            <div class="ai-selection">

                <label class="ai-option">
                    <input type="checkbox" value="ChatGPT" checked>
                    <span>ChatGPT</span>
                </label>

                <label class="ai-option">
                    <input type="checkbox" value="Gemini" checked>
                    <span>Gemini</span>
                </label>

                <label class="ai-option">
                    <input type="checkbox" value="Perplexity" checked>
                    <span>Perplexity</span>
                </label>

            </div>


            <div class="button-row">

                <button id="askButton" class="primary-button">
                    ASK ALL AI
                </button>

                <button id="clearButton" class="secondary-button">
                    CLEAR
                </button>

            </div>

        </section>


        <!-- Answers Section -->
        <section class="card">

            <div class="section-title">
                <h2>AI Answers</h2>
                <span>02</span>
            </div>

            <div id="answersContainer">

                <div class="empty-message">
                    <div class="empty-icon">AI</div>

                    <h3>No answers yet</h3>

                    <p>
                        Enter a question and click
                        <b>ASK ALL AI</b>.
                    </p>
                </div>

            </div>

        </section>


        <!-- Selected Answer -->
        <section class="card selected-card">

            <div class="section-title">
                <h2>Selected Answer</h2>
                <span>03</span>
            </div>

            <div id="selectedAnswer" class="selected-answer">
                No answer selected.
            </div>

            <button id="copyButton" class="copy-button">
                COPY SELECTED ANSWER
            </button>

        </section>

    </main>


    <footer>

        <strong>ALL CHAT AI</strong>

        <p>
            College Mini Project
        </p>

        <p>
            Janardhan K S &nbsp; | &nbsp;
            Jayanth Pal Chakravarthy Y
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
